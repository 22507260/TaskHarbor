name: Feature
description: Propose a concrete improvement with verifiable acceptance criteria.
body:
  - type: textarea
    id: problem
    attributes:
      label: User problem
      description: Describe the concrete situation and expected behavior.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: What observable behavior and tests demonstrate completion?
    validations:
      required: true
  - type: textarea
    id: design
    attributes:
      label: Design and tradeoffs
      description: Include API, persistence, failure behavior and compatibility considerations.
